# Converter and validator services. Phase 2 (O2.3) adds fixture-runner and the one-command path.
#
# The two converter images are commercial and never published: build them locally (see the
# Dockerfile headers). Each licence arrives at run time from a host path named by an environment
# variable and is mounted read-only; it is never in the image, the repository or a log. Both run
# on the native x86_64 host. There is no network, so a licence that needs a licence server will
# have to be an explicit decision, recorded in the qualification document.
#
# Unset variables do not stop compose from parsing, so step-validator can be used alone. They stop
# the converters instead: an empty build arg fails the Dockerfile check, and a licence path that is
# not set or does not exist should fail at container start (create_host_path is off, so no empty
# directory is ever mounted in its place; not exercised, since the converter images cannot be built here).
name: pvec-gold-fixtures

x-converter: &converter
  platform: linux/amd64
  network_mode: none
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  cadex-converter:
    <<: *converter
    image: pvec-gold/cadex-converter:local
    build:
      context: .
      dockerfile: docker/cadex/Dockerfile
      args:
        CADEX_ARTIFACT: ${CADEX_ARTIFACT:-}
        CADEX_SHA256: ${CADEX_SHA256:-}
        CADEX_VERSION: ${CADEX_VERSION:-}
    volumes:
      - type: bind
        source: ${CADEX_LICENSE_FILE:-/set/CADEX_LICENSE_FILE}
        target: /run/secrets/cadex-license
        read_only: true
        bind:
          create_host_path: false
      - ${FIXTURE_DIR:-./fixtures}:/fixtures

  oda-converter:
    <<: *converter
    image: pvec-gold/oda-converter:local
    build:
      context: .
      dockerfile: docker/oda/Dockerfile
      args:
        ODA_DRAWINGS_ARTIFACT: ${ODA_DRAWINGS_ARTIFACT:-}
        ODA_DRAWINGS_SHA256: ${ODA_DRAWINGS_SHA256:-}
        ODA_STEP_ARTIFACT: ${ODA_STEP_ARTIFACT:-}
        ODA_STEP_SHA256: ${ODA_STEP_SHA256:-}
    volumes:
      - type: bind
        source: ${ODA_ACTIVATION_FILE:-/set/ODA_ACTIVATION_FILE}
        target: /run/secrets/oda-activation
        read_only: true
        bind:
          create_host_path: false
      - ${FIXTURE_DIR:-./fixtures}:/fixtures

  # The open converter (ACadSharp, MIT): no licence, runs on either architecture. The limits come from
  # docs/benchmarks/orchestration-tuning.md: a conversion peaks at about 21 MiB in the cgroup (58 MiB
  # resident) on the largest r0-open fixture, so 256m leaves a wide margin, and one cpu doubles the
  # conversion time (the dotnet runtime wants a second thread) while two cost nothing against none.
  # The concurrency cap is not set here: runner/scheduler.py enforces docker/converter-limits.json.
  acadsharp-converter:
    image: pvec-gold/dwg2step-acadsharp:local
    platform: ${ACADSHARP_PLATFORM:-linux/amd64}
    build:
      context: .
      dockerfile: tools/converters/acadsharp/Dockerfile
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "3"
    volumes:
      - ${FIXTURE_DIR:-./fixtures}:/fixtures

  step-validator:
    image: pvec-gold/step-validator:local
    platform: ${VALIDATOR_PLATFORM:-linux/amd64}
    build:
      context: .
      dockerfile: docker/step-validator/Dockerfile
      target: final
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ${FIXTURE_DIR:-./fixtures}:/fixtures

  # O2.3: the one-command path. `docker compose run --rm fixture-runner generate [fixture-id ...]`
  # drives the services above with the host's docker socket (client-side calls only: run, down,
  # image inspect). The repository is mounted at its own host path so the bind mounts the converter
  # services declare resolve on the host, which is the only place the daemon looks. The corpus is
  # mounted read-only at /corpus, the layout corpus/container.pin.json records.
  fixture-runner:
    build:
      context: .
      dockerfile: docker/fixture-runner/Dockerfile
    image: pvec-gold/fixture-runner:local
    platform: ${VALIDATOR_PLATFORM:-linux/amd64}
    network_mode: none
    working_dir: ${PWD}
    environment:
      FIXTURE_DIR: ${FIXTURE_DIR:-${PWD}/fixtures}
    volumes:
      - ${PWD}:${PWD}
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CORPUS_DIR:-./corpus/r0-open}:/corpus:ro
    entrypoint: ["python3", "-m", "runner.generate"]
